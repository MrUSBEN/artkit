[project]
name = "artkit"
version = "0.1.0"
description = "Code-drawn 2D game assets: pixel, flat vector and ink-cartoon styles from one drawing API"
requires-python = ">=3.9"
dependencies = ["pillow", "numpy", "scipy"]
[project.scripts]
artkit = "artkit.cli:main"
[tool.setuptools.packages.find]
include = ["artkit*"]
